# SAHA AYARLARI — makine seviyesi (Pi OS) değerleri
# ---------------------------------------------------------------------------
# NEDEN AYRI DOSYA: uygulama ayarları (kontrol noktaları, eşikler, poz/gain, yön
# referansı, PLC adresi) zaten `config.yaml`'da ve git ile taşınıyor. Ama Pi'nin
# KENDİ ayarları (statik IP, sistem paketleri, servisler) işletim sisteminde durur
# ve git'e girmez. Bu dosya onları TEK YERDE toplar; `tools/yeni_pi_kur.sh` bunu
# okuyup yeni Pi'yi sahadakinin İKİZİ haline getirir.
#
# Kullanım:
#   bash tools/yeni_pi_kur.sh --kontrol   # hiçbir şey değiştirmez, fark raporu verir
#   bash tools/yeni_pi_kur.sh             # eksikleri kurar (her adımda onay sorar)
#
# Değer değiştirdiysen bu dosyayı commit'le — ikizlik ancak böyle korunur.
# ---------------------------------------------------------------------------

# --- Ağ -------------------------------------------------------------------
# Pi'nin PLC ağındaki SABİT adresi. PLC ile aynı /24 blokta olmalı.
# DİKKAT: iki Pi aynı anda bu adresi kullanamaz (ağ çakışır + ikisi de HR100'e
# yazıp PLC'ye çelişkili sonuç gönderir). Yeni Pi'yi açmadan ESKİSİNİ KAPAT.
PI_STATIK_IP="192.168.10.50/24"

# PLC ağının arayüzü. Pi 5'te yerleşik ethernet: eth0
PLC_ARAYUZU="eth0"

# eth0'a GATEWAY VERİLMEZ (bilerek boş). İnternet wlan0'dan gelir; eth0'a gateway
# yazılırsa internet trafiği PLC ağına yönlenir ve kopar.
PLC_ARAYUZU_GATEWAY=""

# --- PLC (doğrulama için; asıl kaynak config.yaml) -------------------------
# yeni_pi_kur.sh bu değerleri config.yaml ile KARŞILAŞTIRIR ve erişimi test eder.
PLC_IP="192.168.10.10"
PLC_PORT="502"

# --- Kameralar ------------------------------------------------------------
# Beklenen kamera sayısı ve sensör. Kablolar TERS sokete takılırsa Kamera 1 ile
# Kamera 2 yer değiştirir ve tüm ROI/eşik/yön referansı yanlış yüze uygulanır.
# 2026-09-15/18: imx296 (Global Shutter) → imx477 (HQ, rolling shutter) x2 değişti;
# imx296'lar Arducam CSI-HDMI uzatıcıyla I2C arızası yaptığı için söküldü.
BEKLENEN_KAMERA_SAYISI="2"
BEKLENEN_KAMERA_SENSORU="imx477"

# --- Uzaktan kontrol ajanı (opsiyonel, geliştirme kolaylığı) --------------
# Telefondaki Claude uygulaması </>Code bölümünde bu adla görünür.
# Kurulum ürünün çalışması için ŞART DEĞİL; yeni_pi_kur.sh ayrıca sorar.
AJAN_ADI="agent_yazilim_konveor"
